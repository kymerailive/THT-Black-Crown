<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Black Crown — The Hollow Tide</title>
<style>
:root{--bg:#0b1520;--bg2:#0f1e2d;--panel:#122335;--line:#1e3a52;--text:#d8e6f0;
--dim:#8aa5b8;--head:#f0f7fc;--sea:#4fd1c5;--sand:#e8c47c;--coral:#ff7d6b;
--shadow:0 8px 30px rgba(0,0,0,.45)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,#14293d 0%,var(--bg) 55%);
color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gatecard{background:var(--panel);border:1px solid var(--line);border-radius:16px;
box-shadow:var(--shadow);padding:40px 36px;max-width:430px;width:100%;text-align:center}
.gatecard h1{margin:.2em 0 .1em;font-size:1.4rem;color:var(--head)}
.gatecard p{color:var(--dim);font-size:.95rem;margin:.4em 0 1.4em}
.gatecard input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
background:var(--bg2);color:var(--text);font-size:1rem;text-align:center;letter-spacing:.06em}
.gatecard button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;cursor:pointer;
background:linear-gradient(135deg,#2b8f86,#4fd1c5);color:#05201d;font-weight:700;font-size:1rem}
.gatecard .err{color:var(--coral);font-size:.9rem;min-height:1.3em;margin-top:10px}
#app{display:none;max-width:980px;margin:0 auto;padding:0 20px 120px}
header.top{position:sticky;top:0;z-index:5;background:rgba(11,21,32,.92);backdrop-filter:blur(8px);
border-bottom:1px solid var(--line);margin:0 -20px;padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;color:var(--head)}
.brand .tide{color:var(--sea)}
.tabbtn{padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;
color:var(--dim);cursor:pointer;font-weight:600}
.tabbtn.on{background:var(--sea);border-color:var(--sea);color:#05201d}
.updated{margin-left:auto;color:var(--dim);font-size:.8rem}
h1{color:var(--head);font-size:2rem;margin:.9em 0 .2em}
.stat{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:12px;
padding:14px 22px;margin:8px 12px 8px 0}
.stat .v{font-size:1.5rem;color:var(--sand);font-weight:800}
.stat .k{color:var(--dim);font-size:.8rem;letter-spacing:.05em;text-transform:uppercase}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin:16px 0}
.pcard h2{margin:.1em 0 .2em;color:var(--head)}
.pmeta{color:var(--dim);font-size:.86rem;margin-bottom:8px}
.pmeta b{color:var(--sand)}
table{border-collapse:collapse;width:100%;font-size:.9rem;margin:.6em 0}
th{background:#16334b;color:var(--head);text-align:left;padding:8px 12px}
td{padding:7px 12px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(odd){background:rgba(255,255,255,.02)}
.muted{color:var(--dim)}
</style></head><body>
<div id="gate"><div class="gatecard">
  <h1>Black Crown</h1>
  <p>The Hollow Tide — team site. Enter your team's passcode.</p>
  <input id="pw" type="password" autocomplete="off" placeholder="passcode">
  <button id="go">Open</button>
  <div class="err" id="err"></div>
</div></div>
<div id="app">
  <header class="top">
    <span class="brand">Black Crown <span class="tide">· The Hollow Tide</span></span>
    <button class="tabbtn on" data-t="team" onclick="pick('team')">Team</button>
    <button class="tabbtn" data-t="players" onclick="pick('players')">Players</button>
    <button class="tabbtn" data-t="base" onclick="pick('base')">Base</button>
    <button class="tabbtn" data-t="npcs" onclick="pick('npcs')">NPCs</button>
    <span class="updated" id="updated"></span>
  </header>
  <div id="main"></div>
</div>
<script>
const ENC={salt:"pSRqcw9GSfFg/7t8DlqJyA==",iv:"lYKUv0FGXOuJLlWb",ct:"Vvs9/d9g1WUyMutzaIh9TL60y+B/qMEZ8St3pz+eRFgU1oWlkO4GNyJlcS+VHmH61JScISOq7OomowzHCeazqUpQ8ItNfKk/5FIukbhvDNEXTtbBgXqc2oe17t+tA4eYQ4Lbja5SbRVs1xk3/44t/gzFOCvOjPnu6OpzJukD0IoKZoQS1GxBF3xMU4HuqkNO6QcAV99j4igmKWT5O+iwNZncvbqz1LyEIAgabkUoi0Uqjk0tgDDLO5jUqzuiQj/No7XOMvmCSGqMdF9d3qWKWstOhkCGizl3hvFOFU6MYKY54RZmyZwqw8ZnIZbzWKdcJke+CovBTbm6dDJ9ParGf7A+7pMHWkJNK70JuBSAdgWrYAJ7CJD3K8aojBbDpDAkI9DQohRVEMt3gfxUrBxuMWII0H6vvYB5rtOAJwGjhi1YuZImHWoy2oqUDp8gOQDqGb5bdH2eD35Bd367FNWQF3FLcHgpSaEWAYPpv7Izf3tE3EY2znocIX5v7iv5qF+QyTdg20ywzKcgpa/ZOfzTJFBAc2ENCCbyrmm7yy/y94JekB7Awyh2uWsmbIAgK2BXO7DzwTr0VX2oByA8ziA/gI9ii0dpfs/Whn3r8EDdHoOklNphrNzWFfWs/hIBXct8AqRR9pQTyaI3Oj7j/3M7wwl+im2J0C2V86AKJfVA+sXUFxFNFGC3V9rf2Zaa25RYfTSAuURiFdpjXJcR1fqrWRQp0PQGE05BORIyfby8Rj4poHYdK9R0RY7QOqCLOcDQcKMy81d3lhTT7W3n0s9AD6aG13mxM2/X8qIgZTxYD3Nk5eKInqokIcNe8hyadGw8qImMixPEMfcsOSeJOYHeTebiFf8JL7HefuPMvZM9828vsfybmPTkhGVUXGY/3M1lhicj8vqYHPcYSRBfps26YpUGO+D8px8mTh7LIFgZ5kobtbSVGgTd879zOMP1i71EzYJJWRbSobVajzqzXRezGOWJ3uRvekA7UadGtHunSjB5PYQTxAsIh7Lvs/xyQ4qpBGA/mQ6+8QM55IBYJxXvyy6ZB7uve0WCtvmnZZH/3mVSmGFY0igztibIhkQKpVHryqGtOWagykmXFsNOv1zabkhtG2usGYuk/no5IW6DUkitOvXZHnPOS/SH/wXa5aEgWn9ek13KUHSegggFInhvsymNgMA+BypJcxIWPcf6TpdMuETSRI5y8hyksxVnOMtE8JrOX/IyQLkD8aC2QLRZA6cZJSx9aNcOD1k2dMRdj1AdItZf8GBH7BwF0h5xPU+mPXFl8aUJQKwtoLNTY5vh0h449BqNn0xqFbT0x8fOfrxMy0lCgUmJA7qxa6nKWaKOBmI1fmeqTsL7p2A8PBaofs3m91WiA6GmKssXkvAPQv47IJvchgFhi9A0gwQNRRbhStezOsSLbYFgOsOBlaoR+/BXDovzH6i9msQZPVwwODyHKLlN5v2AgkHvI8Hw61gBwUnSY2GCxqAeElQnOJ9jfq3REVJbe8ptUOdSS9qNwmoxHNidVpcXv7wSlFglhbfev31GBBC9VMfa2rxDmRBFMA3gVHsaesIlPaagEjHId90NCvf1SGlOjQsLoktHpJWWnIooXNbNfnhX868Il38ysfV2+lkhqV2bD85anbUo2RE83rnQeDoxuWrVmLPHB+yO5eD8npILV6zNwc86d4Gmfa4sYfcgJrQxOfOPRB6Gp4+jVqobGZ+ekVj3NBKabRkH9HZqmX7hH/y3IGUKnlxs18Dzhzo8fFMRlFjlXiVHSQg+EIuuwC1VKa5da0muTY7JKIeUXpFBWaYyz+tcuVHhFrtRg+fsif0LYsG6KEgU7Mnn+aC04nWjqJl7SLxVPf3oD9P87uh+hLRdqXOYaOefufzwjIvURmrkop/1R78Yb8ECZAc7XKvLSBXzWI7K/2FPjfUpY/vY3jE 2hh/Yt64=",iter:310000};
let DATA=null;
const b64buf=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(){
  const pw=document.getElementById('pw').value.replace(/\s+/g,'').toLowerCase();
  const err=document.getElementById('err');
  if(!pw){err.textContent='Enter the passcode.';return}
  err.textContent='';
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64buf(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64buf(ENC.iv)},key,b64buf(ENC.ct));
    DATA=JSON.parse(new TextDecoder().decode(pt));
  }catch(e){err.textContent='That passcode does not open this tide.';return}
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  render();
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString();
let tab='team';
function pick(t){tab=t;render()}
function render(){
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  document.getElementById('updated').textContent='updated '+DATA.updated;
  const m=document.getElementById('main');
  if(tab==='team'){
    const roster=DATA.players.map(p=>`<tr><td><b>${esc(p.name)}</b></td>
      <td class="muted">${esc(p.pronouns)}</td><td>${esc(p.label)}</td>
      <td class="muted">${esc((p.titles||[]).join(', '))}</td></tr>`).join('');
    const stash=DATA.stash.length?DATA.stash.map(i=>`<tr><td>${esc(i.name)}</td>
      <td>×${i.qty}</td><td class="muted">${esc(i.desc||'')}</td></tr>`).join('')
      :'<tr><td colspan="3" class="muted">The stash is empty.</td></tr>';
    m.innerHTML=`<h1>${esc(DATA.team)}</h1>
      <div><span class="stat"><div class="v">${money(DATA.treasury)}</div><div class="k">Team Bank</div></span>
      <span class="stat"><div class="v">${DATA.players.length}</div><div class="k">Players</div></span>
      <span class="stat"><div class="v">${DATA.stash.length}</div><div class="k">Stash items</div></span></div>
      <h2>Roster</h2><table><thead><tr><th>Name</th><th>Pronouns</th><th>Label</th><th>Titles</th></tr></thead>
      <tbody>${roster}</tbody></table>
      <h2>Team stash</h2><table><thead><tr><th>Item</th><th>Qty</th><th>About</th></tr></thead>
      <tbody>${stash}</tbody></table>`;
  }else if(tab==='base'){
    const b=DATA.base;
    if(!b){m.innerHTML='<h1>Base</h1><p class="muted">No base on record for this team — yet.</p>';return}
    const hales=(b.houses||[]).map(h=>`<div class="pcard">
      <h2>${esc(h.name)}${h.function?' <span class="muted" style="font-size:.85rem">— '+esc(h.function)+'</span>':''}</h2>
      ${(h.npcs||[]).length?'<div class="pmeta">'+h.npcs.map(n=>'<b>'+esc(n)+'</b>').join(' · ')+'</div>':''}
      ${h.staff?'<div class="pmeta muted">Also: '+esc(h.staff)+'</div>':''}
    </div>`).join('');
    m.innerHTML=`<h1>${esc(b.name)}</h1>
      ${b.status?`<div class="pmeta">📍 <b>${esc(b.status)}</b></div>`:''}
      ${b.steward?`<div class="pmeta">Steward: <b>${esc(b.steward)}</b></div>`:''}
      ${b.desc?`<p>${esc(b.desc)}</p>`:''}
      <h2>The hale</h2>${hales||'<p class="muted">No houses recorded.</p>'}`;
  }else if(tab==='npcs'){
    if(!(DATA.npcs||[]).length){
      m.innerHTML='<h1>NPCs</h1><p class="muted">No NPCs on record for this team — yet.</p>';return}
    m.innerHTML='<h1>NPCs</h1>'+DATA.npcs.map(n=>`<div class="pcard">
      <h2>${esc(n.name)}</h2>
      <div class="pmeta">${(n.titles||[]).length?esc(n.titles.join(', '))+' · ':''}
        ${n.affiliation?esc(n.affiliation)+' · ':''}
        Post: <b>${esc(n.post)}</b>${n.function?' ('+esc(n.function)+')':''}</div>
      ${n.gif?`<img src="${esc(n.gif)}" alt="" loading="lazy"
        style="max-height:120px;border-radius:8px;margin-top:6px">`:''}
    </div>`).join('');
  }else{
    m.innerHTML='<h1>Players</h1>'+DATA.players.map(p=>{
      const sk=Object.entries(p.skills||{}).filter(e=>e[1]>0)
        .map(e=>e[0].charAt(0).toUpperCase()+e[0].slice(1)+' '+(['','I','II','III','IV','V'][e[1]]||e[1])).join(' · ');
      const inv=(p.inventory||[]).map(i=>`<tr><td>${esc(i.name)}</td><td>×${i.qty}</td>
        <td class="muted">${esc(i.desc||'')}</td></tr>`).join('')
        ||'<tr><td colspan="3" class="muted">Empty bag.</td></tr>';
      return `<div class="pcard"><h2>${esc(p.name)}</h2>
        <div class="pmeta">${esc(p.pronouns)}${p.pronouns?' · ':''}<b>${esc(p.label)}</b>
        ${p.affiliation?' · '+esc(p.affiliation):''}
        ${(p.titles||[]).length?' · '+esc(p.titles.join(', ')):''}</div>
        <div class="pmeta">💰 ${money(p.wallet)}${sk?' · 🎓 '+esc(sk):''}</div>
        <table><thead><tr><th>Item</th><th>Qty</th><th>About</th></tr></thead><tbody>${inv}</tbody></table>
        </div>`;}).join('');
  }
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('go').onclick=unlock;
  document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
});
</script></body></html>
